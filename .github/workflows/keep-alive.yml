# Render's free tier sleeps a web service after 15 minutes without traffic.
# Ping /health every 10 minutes so the backend stays warm.
name: keep-backend-awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping backend /health
        run: |
          for attempt in 1 2 3; do
            if curl -fsS -m 90 https://lyftr-chat-backend-3g6y.onrender.com/health; then
              echo; echo "backend is up"; exit 0
            fi
            echo "attempt $attempt failed, retrying in 15s"; sleep 15
          done
          echo "backend did not respond"; exit 1
